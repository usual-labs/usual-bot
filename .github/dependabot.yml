# Keeps the workflows' pinned actions current. The repository only runs allow-listed actions
# pinned to a commit, and Dependabot updates both the commit and its version comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release before proposing it, so a compromised version has time to be
    # caught and pulled.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
