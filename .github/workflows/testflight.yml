name: TestFlight

# Archives Usual Bot for the Mac and the iPhone with scripts/testflight.sh and uploads both to
# TestFlight. Run it by hand from the Actions tab; it also runs each night once the repository
# variable TESTFLIGHT_NIGHTLY is `true`, and a night with nothing new on main does nothing.
#
# It signs with distribution certificates and App Store profiles a maintainer made beforehand, and
# uploads with an individual App Store Connect API key limited to Usual Bot. Nothing here can make,
# change or revoke certificates or profiles. The secrets live in the `testflight` environment,
# which only main may use; docs/guides/releasing.md lists them and says how to renew them.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Which apps
        type: choice
        options: [both, mac, iphone]
        default: both
      upload:
        description: Upload to TestFlight (off signs and exports only)
        type: boolean
        default: true
  schedule:
    - cron: '17 2 * * *'

permissions: {}

# One upload at a time, and never cancelled halfway.
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  due:
    name: Anything new
    if: >-
      github.repository == 'usual-labs/usual-bot' &&
      (github.event_name == 'workflow_dispatch' || vars.TESTFLIGHT_NIGHTLY == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # find the commit the last nightly built
    outputs:
      run: ${{ steps.due.outputs.run }}
    steps:
      - name: Compare with the last nightly
        id: due
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          run=true
          if [ "$EVENT" = schedule ]; then
            last=$(gh run list -R "$GITHUB_REPOSITORY" --workflow testflight.yml --event schedule \
              --status success --limit 1 --json headSha -q '.[0].headSha // ""')
            if [ "$last" = "$GITHUB_SHA" ]; then
              echo "The last nightly already built $GITHUB_SHA."
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  testflight:
    name: Archive and upload
    needs: due
    if: needs.due.outputs.run == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    environment: testflight
    permissions:
      contents: read # check out the source; nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGNING_P12: ${{ secrets.SIGNING_P12 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
          PROFILE_IOS_APP: ${{ secrets.PROFILE_IOS_APP }}
          PROFILE_IOS_NOTIFICATIONS: ${{ secrets.PROFILE_IOS_NOTIFICATIONS }}
          PROFILE_IOS_SHARE: ${{ secrets.PROFILE_IOS_SHARE }}
          PROFILE_MAC_APP: ${{ secrets.PROFILE_MAC_APP }}
          PROFILE_MAC_NOTIFICATIONS: ${{ secrets.PROFILE_MAC_NOTIFICATIONS }}
          PROFILE_MAC_SHARE: ${{ secrets.PROFILE_MAC_SHARE }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          UPLOAD: ${{ inputs.upload }}
        run: |
          names="APPLE_TEAM_ID SIGNING_P12 SIGNING_P12_PASSWORD PROFILE_IOS_APP PROFILE_IOS_NOTIFICATIONS PROFILE_IOS_SHARE PROFILE_MAC_APP PROFILE_MAC_NOTIFICATIONS PROFILE_MAC_SHARE"
          # Signing without uploading needs no API key.
          [ "$UPLOAD" = false ] || names="$names APPSTORE_API_KEY_ID APPSTORE_API_KEY_P8"
          missing=""
          for name in $names; do
            eval "value=\${$name}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets in the testflight environment:$missing. See docs/guides/releasing.md."
            exit 1
          fi

      - name: Toolchain
        run: xcodebuild -version

      - name: Import the signing certificates
        env:
          SIGNING_P12: ${{ secrets.SIGNING_P12 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          # Certificates made from one signing request share a private key, and Keychain Access then
          # writes it into the .p12 once per certificate. Importing the .p12 whole stops at the second
          # copy, still exits 0, and leaves out what follows. So import each certificate, and each
          # distinct key, on its own. /usr/bin/openssl reads the .p12's RC2 encryption, which
          # OpenSSL 3 refuses without -legacy.
          umask 077
          parts="$RUNNER_TEMP/signing-parts"
          mkdir -p "$parts"
          printf '%s' "$SIGNING_P12" | base64 --decode > "$parts/signing.p12"
          # Writes each PEM block the .p12 holds of one kind to its own file.
          split() {
            prefix="$parts/$1"
            shift
            /usr/bin/openssl pkcs12 -in "$parts/signing.p12" -passin env:SIGNING_P12_PASSWORD "$@" |
              awk -v prefix="$prefix" \
                '/-----BEGIN/ { n++; f = prefix n ".pem" } f { print > f } /-----END/ { close(f); f = "" }'
          }
          set -o pipefail
          split certificate -nokeys
          split key -nocerts -nodes
          for certificate in "$parts"/certificate*.pem; do
            security import "$certificate" -k "$keychain"
          done
          imported=""
          for key in "$parts"/key*.pem; do
            sum=$(shasum < "$key")
            case "$imported" in *"$sum"*) continue ;; esac
            imported="$imported $sum"
            security import "$key" -k "$keychain" \
              -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          done
          rm -rf "$parts"
          # Apple's intermediate for distribution certificates, in case the runner lacks it.
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/AppleWWDRCAG3.cer"
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$keychain" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          # Both certificates must be there with at least 30 days left.
          for name in 'Apple Distribution' 'Installer'; do
            if ! pem=$(security find-certificate -c "$name" -p "$keychain"); then
              echo "::error::The .p12 has no $name certificate. See docs/guides/releasing.md."
              exit 1
            fi
            printf '%s\n' "$pem" | openssl x509 -noout -subject -enddate
            if ! printf '%s\n' "$pem" | openssl x509 -noout -checkend 2592000 > /dev/null; then
              echo "::error::The $name certificate expires within 30 days. Make a new one; docs/guides/releasing.md says how."
              exit 1
            fi
          done

      - name: Write the profiles and the API key
        env:
          PROFILE_IOS_APP: ${{ secrets.PROFILE_IOS_APP }}
          PROFILE_IOS_NOTIFICATIONS: ${{ secrets.PROFILE_IOS_NOTIFICATIONS }}
          PROFILE_IOS_SHARE: ${{ secrets.PROFILE_IOS_SHARE }}
          PROFILE_MAC_APP: ${{ secrets.PROFILE_MAC_APP }}
          PROFILE_MAC_NOTIFICATIONS: ${{ secrets.PROFILE_MAC_NOTIFICATIONS }}
          PROFILE_MAC_SHARE: ${{ secrets.PROFILE_MAC_SHARE }}
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          umask 077
          profiles="$RUNNER_TEMP/profiles"
          mkdir -p "$profiles"
          printf '%s' "$PROFILE_IOS_APP" | base64 --decode > "$profiles/ios-app.mobileprovision"
          printf '%s' "$PROFILE_IOS_NOTIFICATIONS" | base64 --decode > "$profiles/ios-notifications.mobileprovision"
          printf '%s' "$PROFILE_IOS_SHARE" | base64 --decode > "$profiles/ios-share.mobileprovision"
          printf '%s' "$PROFILE_MAC_APP" | base64 --decode > "$profiles/macos-app.provisionprofile"
          printf '%s' "$PROFILE_MAC_NOTIFICATIONS" | base64 --decode > "$profiles/macos-notifications.provisionprofile"
          printf '%s' "$PROFILE_MAC_SHARE" | base64 --decode > "$profiles/macos-share.provisionprofile"
          echo "SIGNING_PROFILES=$profiles" >> "$GITHUB_ENV"
          if [ -n "$APPSTORE_API_KEY_P8" ]; then
            printf '%s\n' "$APPSTORE_API_KEY_P8" > "$RUNNER_TEMP/api-key.p8"
            echo "APP_STORE_CONNECT_KEY_PATH=$RUNNER_TEMP/api-key.p8" >> "$GITHUB_ENV"
          fi

      - name: Archive and upload
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          PLATFORMS: ${{ inputs.platforms }}
          UPLOAD: ${{ inputs.upload }}
        run: |
          # A nightly has no inputs: both apps, uploaded.
          check=""
          [ "$UPLOAD" != false ] || check=--check
          case "$PLATFORMS" in mac | iphone) only="$PLATFORMS" ;; *) only="" ;; esac
          scripts/testflight.sh $check $only

      - name: Clean up
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi
          rm -rf "$RUNNER_TEMP/signing-parts" "$RUNNER_TEMP/profiles" "$RUNNER_TEMP/api-key.p8" \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
