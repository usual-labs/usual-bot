name: CodeQL

# Scans the Swift code and the workflows with CodeQL; findings show up in code scanning. Swift is
# built with xcodebuild on the macOS 26 runner like CI, so the app target is scanned as well as the
# packages (GitHub's default setup only built the packages).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 5 * * 2'

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read # check out the source
      security-events: write # report findings in code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            runner: ubuntu-latest
          - language: swift
            build-mode: manual
            runner: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build the app
        if: matrix.language == 'swift'
        run: >
          xcodebuild build -project UsualBot.xcodeproj -scheme UsualBot
          -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
