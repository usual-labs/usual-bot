name: CI

on:
  push:
    branches: [main]
  pull_request:

# Reading the code is all CI needs.
permissions:
  contents: read # check out the source; nothing else

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The name is the required status check on main.
    name: build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: xcodebuild -version && swift --version

      - name: Lint
        run: swift format lint --strict --recursive App Packages

      - name: Check test waits
        run: scripts/check-test-waits.sh

      - name: Test HermesKit
        run: swift test --package-path Packages/HermesKit

      - name: Test UsualUI
        run: swift test --package-path Packages/UsualUI

      - name: Build macOS
        run: >
          xcodebuild build -project UsualBot.xcodeproj -scheme UsualBot
          -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO

      - name: Build iOS Simulator
        run: >
          xcodebuild build -project UsualBot.xcodeproj -scheme UsualBot
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
