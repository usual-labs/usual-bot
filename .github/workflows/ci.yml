name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Toolchain
        run: xcodebuild -version && swift --version

      - name: Lint
        run: swift format lint --strict --recursive App Packages

      - name: Test HermesKit
        run: swift test --package-path Packages/HermesKit

      - name: Test UsualUI
        run: swift test --package-path Packages/UsualUI

      - name: Build macOS
        run: >
          xcodebuild build -project UsualBot.xcodeproj -scheme UsualBot
          -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO

      - name: Build iOS Simulator
        run: >
          xcodebuild build -project UsualBot.xcodeproj -scheme UsualBot
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
