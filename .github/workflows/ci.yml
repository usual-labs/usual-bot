name: CI

# Lints, tests and builds the app for macOS and the iOS Simulator in one macOS job. GitHub runs at
# most five macOS jobs at once for this repository, so one job a run lets pull requests run side by
# side instead of queueing behind each other and main. A change to documentation alone skips the
# macOS job. The `build` job at the end is the required status check on main: it passes when every
# job passed, or was skipped because only documentation changed. Add a job to its `needs` rather
# than to the ruleset.
#
# The macOS job builds with the Xcode in .xcode-version, which scripts/check.sh selects. Change the
# runner image here when that Xcode moves to another one.

on:
  push:
    branches: [main]
  pull_request:

# Reading the code is all CI needs.
permissions:
  contents: read # check out the source; nothing else

# A new push to a pull request, or to main, replaces the older run still going. Each pull request
# was checked before it merged, so main skipping a commit it cancelled loses little.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Documentation only?
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          # The macOS job runs unless every changed file is documentation. When the diff can't be
          # worked out (a new branch, a rewritten base), it runs.
          app=true
          if files=$(git diff --name-only "$BASE...$HEAD" 2>/dev/null) && [ -n "$files" ]; then
            printf '%s\n' "$files"
            others=$(printf '%s\n' "$files" \
              | grep -Ev '^docs/|\.md$|^\.github/(ISSUE_TEMPLATE|triage)/|^\.github/CODEOWNERS$|^LICENSE' \
              || true)
            [ -n "$others" ] || app=false
          fi
          echo "Run the macOS job: $app"
          echo "app=$app" >> "$GITHUB_OUTPUT"

  app:
    name: Lint, test and build
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint, checks and both test suites
        run: scripts/check.sh --fast

      - name: Build macOS
        run: scripts/check.sh macos

      - name: Build iOS Simulator
        run: scripts/check.sh ios

  build:
    # The name is the required status check on main.
    name: build
    needs: [changes, app]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          APP: ${{ needs.changes.outputs.app }}
          CHANGES: ${{ needs.changes.result }}
          APP_JOB: ${{ needs.app.result }}
        run: |
          echo "What changed: $CHANGES. Lint, test and build: $APP_JOB."
          [ "$CHANGES" = success ] || exit 1
          expected=success
          [ "$APP" = true ] || expected=skipped
          [ "$APP_JOB" = "$expected" ]
