# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  high_level_summary: false
  poem: false
  review_status: false
  request_changes_workflow: false
  auto_review:
    enabled: true
  path_filters:
    - "!docs/screenshots/**"
    - "!design/**"
  path_instructions:
    - path: "Packages/*/Sources/**/*.swift"
      instructions: >-
        Hold changed code to CONTRIBUTING.md and the package's docs/agents/04-conventions-and-patterns.md.
        Flag anything that adds Settings, skill setup or gateway administration: those stay in the
        official Hermes app.
    - path: "Packages/UsualUI/Sources/**/*.swift"
      instructions: >-
        Check the surfaces listed in AGENTS.md. Text shown to users must say what happened and what
        to do next, in plain sentences. Icon buttons need accessibility labels, and colours come from Theme.
    - path: "Packages/*/Tests/**/*.swift"
      instructions: >-
        Review only tests this pull request adds or grows, by the rules under "Test the logic" in
        CONTRIBUTING.md. Ask for fewer or smaller tests, never for more coverage.
    - path: "{.github,.githooks,scripts,Config}/**"
      instructions: >-
        These control CI, signing and releases. Actions stay pinned to full commit SHAs, and workflows
        keep least-privilege permissions. Treat anything that broadens either as needing a human decision.
knowledge_base:
  code_guidelines:
    filePatterns:
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "docs/agents/04-workspace-conventions.md"
      - "Packages/*/docs/agents/04-conventions-and-patterns.md"
